<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071525" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Azur" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>Azur Triathlon Coaching</title>
  </head>
  <body>
    <div id="root"><main id="azur-startup-fallback" style="min-height:100vh;background:#071525;color:#eaf4fb;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif"><div style="max-width:420px;text-align:center"><strong style="font-size:22px;letter-spacing:0.08em">AZUR</strong><p style="color:#a6c1d6">Loading your training experience…</p><p id="azur-startup-help" style="display:none;color:#eaf4fb">This preview could not start. Open the link directly in Safari and reload. Your training data has not been changed.</p></div></main></div>
    <script>
      // A module/network failure can prevent React's error boundary from mounting.
      // Keep a useful fallback instead of an unexplained blank screen.
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          var help = document.getElementById('azur-startup-help');
          if (help) help.style.display = 'block';
        }
      }, true);
      window.setTimeout(function () {
        if (document.getElementById('azur-startup-fallback')) {
          var help = document.getElementById('azur-startup-help');
          if (help) help.style.display = 'block';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
