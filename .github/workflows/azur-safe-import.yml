name: AZUR safe import checks
on:
  pull_request:
    paths:
      - 'azur-v1/src/lib/**'
      - 'azur-v1/api/intervals/**'
      - 'azur-v1/tests/**'
      - 'azur-v1/src/app/styles.css'
      - 'azur-v1/src/app/AthleteOnboardingDraft.tsx'
      - 'azur-v1/src/app/App.tsx'
      - 'azur-v1/src/main.tsx'
      - 'azur-v1/supabase/functions/**'
      - 'azur-v1/src/lib/calculations/trainingLoad.ts'
      - 'azur-v1/supabase/migrations/**'
      - 'azur-v1/supabase/tests/**'
      - 'azur-v1/supabase/staging/**'
      - '.github/workflows/azur-safe-import.yml'
  workflow_dispatch:
jobs:
  import-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azur-v1
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep API tests out of deployable function routes
        run: |
          if find api -name '*.test.*' | grep -q .; then
            echo 'API tests must live under tests/api, outside deployed routes' >&2
            exit 1
          fi
      - name: Run import safety checks
        run: npm test
      - name: Test authenticated acceptance and load handlers
        run: node --test tests/api/intervals/*.test.mjs
      - name: Build app
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_verification
        run: |
          npm install --no-package-lock
          npm run build

  database-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azur_import_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d azur_import_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: azur_import_test
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic athlete tables
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/intervals_fixture.sql
      - name: Apply migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/migrations/20261030152435_intervals_import_inbox.sql
      - name: Install reviewed-acceptance transaction
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/migrations/20261030152441_intervals_accept_reviewed.sql
      - name: Install training-load approval
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/migrations/20261030152448_intervals_validate_load.sql
      - name: Protect imported records from browser writes
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/migrations/20261030152454_protect_intervals_activity_writes.sql
      - name: Assert database staging invariants
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/intervals_atomic_test.sql
      - name: Verify reviewed acceptance safety
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/intervals_accept_reviewed_test.sql
      - name: Verify training-load approval
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/intervals_validate_load_test.sql
      - name: Verify imported write protection and manual logging
        run: psql -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/intervals_write_protection_test.sql
      - name: Verify actual concurrent staging requests
        run: bash azur-v1/supabase/tests/intervals_concurrent_test.sh
      - name: Verify standalone staging bootstrap and rolled-back smoke test
        run: |
          createdb azur_staging_schema
          psql -d azur_staging_schema -v ON_ERROR_STOP=1 -f azur-v1/supabase/tests/staging_managed_auth_fixture.sql
          psql -d azur_staging_schema -v ON_ERROR_STOP=1 -c "set azur.staging_project_ref='juvceqrzkeethontnezw'" -f azur-v1/supabase/staging/import_baseline.sql
          for migration in azur-v1/supabase/migrations/*.sql; do
            psql -d azur_staging_schema -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -d azur_staging_schema -v ON_ERROR_STOP=1 -c "set azur.staging_project_ref='juvceqrzkeethontnezw'" -f azur-v1/supabase/staging/transaction_smoke.sql
          remaining=$(psql -d azur_staging_schema -v ON_ERROR_STOP=1 -Atqc 'select (select count(*) from public.athlete_profile)+(select count(*) from public.completed_activity)+(select count(*) from public.intervals_import_inbox)')
          test "$remaining" = "0"


  browser-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azur-v1
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --no-package-lock
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify synthetic ride review and mobile onboarding in Chromium
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/azur-browser-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/intervals-review.browser.mjs
