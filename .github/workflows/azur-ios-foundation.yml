name: AZUR native foundation build
on:
  pull_request:
    paths:
      - 'azur-v1/package.json'
      - 'azur-v1/capacitor.config.ts'
      - 'azur-v1/src/lib/nativeLinkRouting*'
      - 'azur-v1/src/lib/nativeAppLinks.ts'
      - 'azur-v1/ios-preparation/**'
      - 'azur-v1/docs/ios-capacitor-setup.md'
      - '.github/workflows/azur-ios-foundation.yml'
jobs:
  web-and-capacitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install packages and build
        working-directory: azur-v1
        run: |
          npm install --no-package-lock
          npm run build
      - name: Validate native callback links
        working-directory: azur-v1
        run: node --test src/lib/nativeLinkRouting.test.mjs src/lib/aasaTemplate.test.mjs
      - name: Validate Capacitor config
        working-directory: azur-v1
        run: npx cap config
