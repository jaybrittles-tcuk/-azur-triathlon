name: AZUR onboarding build
on:
  pull_request:
    paths:
      - 'azur-v1/src/app/App.tsx'
      - 'azur-v1/src/app/styles.css'
      - 'azur-v1/src/app/AthleteOnboardingDraft.tsx'
      - '.github/workflows/azur-mobile-onboarding.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and compile AZUR
        working-directory: azur-v1
        run: |
          npm install --no-package-lock
          npm run build
